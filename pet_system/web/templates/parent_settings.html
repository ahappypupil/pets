{% extends "parent_base.html" %}
{% block title %}设置{% endblock %}
{% block content %}
<h1>⚙️ 系统设置（配置全部存在数据库）</h1>
<div class="parent-card">
  <p style="font-size:16px;color:#718096;margin-bottom:14px">修改只会影响之后的行为，历史流水与毕业证书不会变。每次修改都有审计记录。</p>
  <div id="cfg"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let cfg={};
// 每个配置项对应的取值字段与类型（与 seed.sql 中的 JSON 结构一一对应）
const FIELD={
  exchange_rate:{key:'rate', type:'number'},
  stock_cap:{key:'cap', type:'number'},
  daily_target:{key:'points', type:'number'},
  holiday_mode:{key:'enabled', type:'bool'},
  pet_svg_version:{key:'version', type:'text'}
};
function displayValue(k,v){
  if(k==='form_thresholds')return (v&&v.t1)+','+(v&&v.t2);
  const spec=FIELD[k];
  if(!spec)return JSON.stringify(v);
  const x=v&&typeof v==='object'?v[spec.key]:undefined;
  if(x===undefined||x===null)return '';
  return spec.type==='bool'?(x?'开启':'关闭'):String(x);
}
async function load(){
  const r=await Pet.api('/parent/api/config');cfg=r.data;
  const el=document.getElementById('cfg');
  el.innerHTML=Object.keys(cfg).map(k=>{
    const v=cfg[k].value;
    const val=displayValue(k,v);
    const desc=cfg[k].description||'';
    return '<div style="display:flex;align-items:center;gap:12px;margin:10px 0;font-size:16px">'+
      '<b style="width:180px">'+k+'</b>'+
      '<input class="pinput" style="max-width:220px" value="'+String(val).replace(/"/g,'&quot;')+'" data-k="'+k+'" >'+
      '<span style="color:#A0AEC0">'+desc+'</span>'+
      '<button class="pbtn" onclick="save(\''+k+'\')">保存</button></div>';
  }).join('');
}
function buildValue(k,input){
  const raw=input.value.trim();
  if(k==='form_thresholds'){
    const nums=raw.split(/[,，]/).map(s=>Number(s.trim()));
    return {t1:nums[0]||3,t2:nums[1]||3};
  }
  const spec=FIELD[k];
  if(spec&&spec.type==='bool')return {[spec.key]:raw==='true'||raw==='1'||raw==='开启'};
  if(spec&&spec.type==='number')return {[spec.key]:Number(raw)||0};
  if(spec)return {[spec.key]:raw};
  return {value:raw};
}
async function save(k){
  const input=document.querySelector('input[data-k="'+k+'"]');
  const r=await Pet.post('/parent/api/config',{key:k,value:buildValue(k,input)});
  Pet.toast(r.message,!r.ok);load();
}
load();
</script>
{% endblock %}
