<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>家长登录</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/kids.css') }}"></head>
<body class="parent-page">
<div class="login-wrap"><div class="login-card">
  <div style="font-size:56px">👨‍👩‍👧</div>
  <h1>家长中心</h1>
  <p>默认账号 admin / 密码 admin123（可在数据库修改）</p>
  <input class="text-input" id="u" placeholder="账号" value="admin">
  <input class="text-input" id="p" type="password" placeholder="密码" style="margin-top:12px">
  <div class="btn-row" style="margin-top:22px">
    <button class="bigbtn blue" onclick="go()">登录</button>
  </div>
  <div class="msg" id="msg"></div>
</div></div>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script>
async function go(){
  const r=await Pet.post('/parent/login',{username:document.getElementById('u').value,password:document.getElementById('p').value});
  if(r.ok)location.href='/parent/';else document.getElementById('msg').textContent=r.message;
}
</script>
</body></html>
